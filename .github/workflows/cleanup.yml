name: "Cleanup old workflow runs & caches"

on:
  workflow_dispatch:
    inputs:
      keep_runs:
        description: "Jumlah run terakhir yang disimpan"
        required: true
        default: "10"
        type: string
      keep_caches:
        description: "Jumlah cache terakhir yang disimpan (0 = disable cache cleanup)"
        required: true
        default: "5"
        type: string
      dry_run:
        description: "Jika dicentang, hanya simulasi (uncheck untuk benar-benar menghapus)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cleanup workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          KEEP: ${{ inputs.keep_runs }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          echo "=== Membersihkan Workflow Runs ==="
          echo "Repository: $GH_REPO"
          echo "Menyimpan $KEEP run terakhir"
          echo "Dry-run: $DRY"
          echo ""

          ALL_RUNS=$(gh run list --limit 500 --json databaseId -q '.[].databaseId')
          TO_DELETE=$(echo "$ALL_RUNS" | tail -n +$((KEEP + 1)))

          if [ -z "$TO_DELETE" ]; then
            echo "Tidak ada runs yang perlu dihapus (total run <= $KEEP)."
          else
            for id in $TO_DELETE; do
              if [ "$DRY" = "true" ]; then
                echo "DRY RUN: akan menghapus run id=$id"
              else
                echo "Menghapus run id=$id"
                gh run delete "$id" || echo "Gagal menghapus run id=$id"
              fi
            done
          fi

      - name: Cleanup caches (optional)
        if: ${{ inputs.keep_caches != '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          KEEP_CACHES: ${{ inputs.keep_caches }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          echo "=== Membersihkan Caches ==="
          echo "Menyimpan $KEEP_CACHES cache terakhir"
          echo "Dry-run: $DRY"
          echo ""

          ALL_CACHES=$(gh cache list --limit 100 --json id -q '.[].id')
          TO_DELETE_CACHE=$(echo "$ALL_CACHES" | tail -n +$((KEEP_CACHES + 1)))

          if [ -z "$TO_DELETE_CACHE" ]; then
            echo "Tidak ada cache yang perlu dihapus (total cache <= $KEEP_CACHES)."
          else
            for cid in $TO_DELETE_CACHE; do
              if [ "$DRY" = "true" ]; then
                echo "DRY RUN: akan menghapus cache id=$cid"
              else
                echo "Menghapus cache id=$cid"
                gh cache delete "$cid" || echo "Gagal menghapus cache id=$cid"
              fi
            done
          fi
