name: Code Quality & Linting

on:
  push:
    branches: [ main, development, feature/go-rewrite ]
  pull_request:
    branches: [ main, development ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Run Package Tests
        run: |
          cd backend
          go test -v ./...

  golangci:
    name: Lint & Static Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: GolangCI-Lint Static Verification
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          install-mode: goinstall
          working-directory: backend
          args: --timeout=5m
