name: Code Quality & Linting

on:
  push:
    branches: [ dev-go, main, development, feature/go-rewrite ]
  pull_request:
    branches: [ dev-go, main, development ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-check:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun Store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Next.js Build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lockb', '**/package.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lockb', '**/package.json') }}-

      - name: Install Dependencies & Run Typecheck Build & UI Tests
        run: |
          bun install --frozen-lockfile
          bun run test:ui
          bun run build

  go-test:
    name: Run Go Unit Tests & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Build Frontend Assets for Embedding
        run: |
          bun install --frozen-lockfile
          bun run build
          mkdir -p backend/web/out
          cp -r out/* backend/web/out/

      - name: Run Go Vet & Package Tests
        run: |
          cd backend
          go vet ./...
          go test -v ./...

  golangci:
    name: Go Lint & Static Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: GolangCI-Lint Static Verification
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          working-directory: backend
          args: --timeout=5m
